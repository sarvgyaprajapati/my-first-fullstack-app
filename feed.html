<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #14121f; min-height: 100vh; color: #fff; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  header h1 { font-size: 1.2rem; }
  #logoutBtn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;
    padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
  }
  #logoutBtn:hover { background: rgba(255,255,255,0.2); }

  .container { max-width: 560px; margin: 30px auto; padding: 0 16px; }

  #postBox {
    background: rgba(255,255,255,0.06); border-radius: 14px; padding: 16px; margin-bottom: 24px;
    display: none; animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  #postBox textarea {
    width: 100%; min-height: 70px; border-radius: 8px; border: none; padding: 10px; font-size: 0.95rem;
    resize: vertical; outline: none;
  }
  #postBtn {
    margin-top: 10px; padding: 9px 18px; border: none; border-radius: 8px; background: #6c63ff;
    color: #fff; cursor: pointer;
  }
  #postBtn:hover { background: #5a52e0; }

  .post {
    background: rgba(255,255,255,0.05); border-radius: 14px; padding: 16px; margin-bottom: 16px;
    opacity: 0; transform: translateY(10px); animation: fadeIn 0.5s ease forwards;
  }
  .post .owner { font-weight: 600; color: #b9a9ff; font-size: 0.85rem; margin-bottom: 6px; }
  .post .content { font-size: 1rem; line-height: 1.4; margin-bottom: 10px; }
  .post .time { font-size: 0.75rem; color: #888; margin-bottom: 10px; }

  .reactions { display: flex; gap: 8px; }
  .reactBtn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff;
    padding: 6px 10px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    transition: transform 0.15s, background 0.2s;
  }
  .reactBtn:hover { background: rgba(255,255,255,0.18); }
  .reactBtn.pop { animation: pop 0.3s ease; }
  @keyframes pop { 50% { transform: scale(1.35); } }

  #statusMsg { text-align: center; color: #ffb3b3; margin-top: 10px; }
</style>
</head>
<body>
  <header>
    <h1 id="welcomeText">Feed</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <div class="container">
    <div id="postBox">
      <textarea id="postContent" placeholder="Kuch likhein..."></textarea>
      <br />
      <button id="postBtn">Post</button>
    </div>

    <div id="postsList">Loading...</div>
    <div id="statusMsg"></div>
  </div>

<script>
  const API_BASE = 'https://my-first-fullstack-app-1.onrender.com';
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  const name = localStorage.getItem('name');

  // Login na ho to login page par bhej do
  if (!token) {
    window.location.href = 'login.html';
  }

  document.getElementById('welcomeText').textContent = `Namaste, ${name || 'User'}`;

  if (role === 'owner') {
    document.getElementById('postBox').style.display = 'block';
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.clear();
    window.location.href = 'login.html';
  });

  const REACTION_EMOJI = { like: '👍', heart: '❤️', clap: '👏', fire: '🔥' };

  async function loadPosts() {
    const list = document.getElementById('postsList');
    try {
      const res = await fetch(`${API_BASE}/api/posts`);
      if (!res.ok) throw new Error('Failed');
      const posts = await res.json();

      if (posts.length === 0) {
        list.innerHTML = '<p style="color:#999;">Abhi koi post nahi hai.</p>';
        return;
      }

      list.innerHTML = posts
        .map(
          (p) => `
        <div class="post">
          <div class="owner">${escapeHtml(p.owner_name)}</div>
          <div class="content">${escapeHtml(p.content)}</div>
          <div class="time">${new Date(p.created_at).toLocaleString()}</div>
          <div class="reactions">
            ${Object.keys(REACTION_EMOJI)
              .map(
                (type) => `
              <button class="reactBtn" data-post="${p.id}" data-type="${type}">
                ${REACTION_EMOJI[type]} <span>${p.reactions[type] || 0}</span>
              </button>
            `
              )
              .join('')}
          </div>
        </div>
      `
        )
        .join('');

      document.querySelectorAll('.reactBtn').forEach((btn) => {
        btn.addEventListener('click', () => handleReact(btn));
      });
    } catch (err) {
      list.innerHTML = '';
      document.getElementById('statusMsg').textContent =
        'Posts load nahi ho paayi. Backend chal raha hai check karein.';
    }
  }

  async function handleReact(btn) {
    const postId = btn.dataset.post;
    const type = btn.dataset.type;
    btn.classList.add('pop');
    setTimeout(() => btn.classList.remove('pop'), 300);

    try {
      const res = await fetch(`${API_BASE}/api/posts/${postId}/react`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ type }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('statusMsg').textContent = data.error || 'Reaction fail ho gayi.';
        return;
      }
      loadPosts(); // counts refresh karo
    } catch (err) {
      document.getElementById('statusMsg').textContent = 'Network error: reaction save nahi ho paayi.';
    }
  }

  document.getElementById('postBtn')?.addEventListener('click', async () => {
    const content = document.getElementById('postContent').value.trim();
    if (!content) return;
    try {
      const res = await fetch(`${API_BASE}/api/posts`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ content }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('statusMsg').textContent = data.error || 'Post fail ho gaya.';
        return;
      }
      document.getElementById('postContent').value = '';
      loadPosts();
    } catch (err) {
      document.getElementById('statusMsg').textContent = 'Network error: post save nahi ho paaya.';
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadPosts();
</script>
</body>
</html>
